[package]
name = "rust-analyzer-split"
version = "0.1.0"
edition = "2024"
description = "Partition a Cargo workspace between a native and a wasm rust-analyzer"
license = "MIT"

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
cfg-expr = "0.20"
clap = { version = "4", features = ["derive"] }
lsp-server = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
